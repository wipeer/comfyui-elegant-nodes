name: Publish to Comfy Registry

# Publishes whenever pyproject.toml changes on main (bump the version to release).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pyproject.toml"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish custom node
    runs-on: ubuntu-latest
    if: github.repository_owner == 'wipeer'
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Skip when the registry token isn't set up yet
        if: env.REGISTRY_ACCESS_TOKEN == ''
        run: echo "::notice::Add the REGISTRY_ACCESS_TOKEN repository secret to publish."
      - name: Publish to the Comfy Registry
        if: env.REGISTRY_ACCESS_TOKEN != ''
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
