[project]
# Registry id: permanent once published. Folder name when installed via ComfyUI-Manager.
name = "elegant-nodes"
description = "Utility nodes built to work inside subgraphs: buttons, live results and previews stay usable on the subgraph node. A seed with random/fixed controls, an aspect-ratio resolution selector, plain-text previews and a math expression node."
version = "1.1.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent"]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/wipeer/comfyui-elegant-nodes"
Documentation = "https://github.com/wipeer/comfyui-elegant-nodes#readme"
"Bug Tracker" = "https://github.com/wipeer/comfyui-elegant-nodes/issues"

[tool.comfy]
# Your publisher id from https://registry.comfy.org (the part after "@" on your profile).
PublisherId = "wipeer"
DisplayName = "Elegant Nodes"
Icon = "https://raw.githubusercontent.com/wipeer/comfyui-elegant-nodes/main/docs/icon.svg"
# First ComfyUI release with Autogrow (auto-expanding) inputs in the V3 node API.
requires-comfyui = ">=0.4.0"
